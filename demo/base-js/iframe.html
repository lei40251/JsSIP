<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'>
  <link rel='shortcut icon' href='data:image/ico;base64,aWNv' type='image/x-icon' />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;

    body {
      display: flex;
