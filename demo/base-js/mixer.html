<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixer v6.3 (输入/输出双重FPS控制)</title>
    <link rel="stylesheet" href="./bootstrap-5.1.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./bootstrap-icons-1.8.1/bootstrap-icons.css">
    <style>
        :root {
            --primary: #0d6efd;
            --danger: #dc3545;
            --success: #198754;
            --muted: #64748b;
            --space-xs: 0.375rem;
            --space-sm: 0.5rem;
            --space-md: 0.75rem;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--bs-body-font-family);
            background: #e8edf5;
            color: #1f2937;
            margin: 0;
            min-height: 100%;
        }

        .min-h-0 {
            min-height: 0;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 0.75rem;
            padding-bottom: 0.875rem;
        }

        .workspace-row {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            align-items: stretch;
        }

        .workspace-row>[class*="col-"] {
            height: 100%;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .panel-shell {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            border: 0 !important;
            border-radius: 0.5rem !important;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            background: #fff;
        }

        .panel-shell.p-2 {
            padding: var(--space-md) !important;
        }

        .panel-shell .row {
            --bs-gutter-x: var(--space-sm);
            --bs-gutter-y: var(--space-sm);
        }

        .panel-shell .form-label {
            margin-bottom: var(--space-xs) !important;
        }

        .panel-shell .mb-2 {
            margin-bottom: var(--space-sm) !important;
        }

        .panel-shell .mt-1 {
            margin-top: var(--space-sm) !important;
        }

        .controls-stack {
            min-height: 0;
            overflow: hidden;
            gap: var(--space-md) !important;
        }

        .controls-stack>.panel-shell {
            flex: 0 1 auto;
        }

        .controls-stack>#panel-watermark {
            flex: 1 1 0;
            min-height: 0;
        }

        .side-stack {
            min-height: 0;
            overflow: hidden;
            gap: var(--space-md) !important;
        }

        .side-stack>.panel-shell {
            flex: 0 0 auto;
        }

        .side-stack>#panel-submix {
            flex: 0 0 auto !important;
        }

        #panel-submix {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        @media (min-width: 1200px) {
            .workspace-row>.mixer-col-left {
                flex: 0 0 360px;
                max-width: 360px;
                width: 360px;
            }

            .workspace-row>.mixer-col-main {
                flex: 1 1 0;
                max-width: none;
                width: auto;
            }

            .workspace-row>.mixer-col-right {
                flex: 0 0 360px;
                max-width: 360px;
                width: 360px;
            }
        }

        .app-header {
            backdrop-filter: blur(10px);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
            height: auto;
            flex: 0 0 auto;
            border: 0 !important;
            border-radius: 0.5rem !important;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.18) !important;
            padding: 0.7rem 0.95rem !important;
        }

        .preview-toolbar-actions {
            display: flex;
            gap: 0.35rem;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
            flex-wrap: wrap;
        }

        .preview-toolbar-actions .btn {
            padding-left: 0.55rem;
            padding-right: 0.55rem;
        }

        .output-param-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
        }

        .output-param-footer {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            justify-content: flex-end;
            margin-top: var(--space-sm);
        }

        .output-param-footer .btn {
            min-width: 4.2rem;
        }

        .output-param-footer #audio-monitor-row {
            display: inline-flex;
            align-items: center;
        }

        .preview-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            padding: var(--space-md);
            background: #f8fafc;
        }

        .panel-scroll {
            min-height: 0;
            overflow-y: auto;
        }

        .inspector-scroll {
            min-height: 0;
            overflow-y: auto;
        }

        .inspector-scroll>section {
            flex: 0 0 auto;
        }

        .preview-shell {
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
            position: relative;
        }

        .preview-stage {
            flex: 1 1 auto;
            min-height: 0;
            background:
                radial-gradient(circle at top, rgba(96, 165, 250, 0.14), transparent 46%),
                linear-gradient(180deg, #313944 0%, #232a33 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: var(--space-md);
        }

        .preview-stage-frame {
            position: relative;
            background: #1f232a;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            flex: 0 0 auto;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
            box-shadow:
                0 18px 36px rgba(15, 23, 42, 0.26),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .preview-titlebar,
        .audio-viz-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .slot-grid-selector {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.35rem;
        }

        .slot-btn {
            height: 2.44rem;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            font-weight: 700;
        }

        .slot-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8fbff;
        }

        .slot-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: none;
        }

        .slot-btn.occupied {
            color: #0f172a;
            border-color: #93c5fd;
        }

        .slot-btn.occupied::after {
            content: '';
            position: absolute;
            right: 0.35rem;
            top: 0.35rem;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: var(--success);
        }

        .slot-btn.has-watermark::before {
            content: 'WM';
            position: absolute;
            left: 0.3rem;
            bottom: 0.2rem;
            color: var(--primary);
            font-size: 0.55rem;
            font-weight: 800;
        }

        .slot-btn.active.has-watermark::before {
            color: #fff;
        }

        .selected-slot-card {
            display: grid;
            grid-template-columns: 2rem minmax(0, 1fr);
            gap: 0.4rem;
            align-items: center;
            padding: 0.3rem;
            background: #f8fafc;
            border: 1px solid #d7dee8;
            border-radius: 0.35rem;
        }

        .selected-slot-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 3rem;
            background: var(--primary);
            color: #fff;
            border-radius: 0.35rem;
            font-size: 1rem;
            font-weight: 800;
        }

        .selected-slot-meta {
            min-width: 0;
            color: var(--muted);
            font-size: 0.74rem;
            line-height: 1.2;
        }

        .selected-slot-meta>div {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .submix-panel {
            opacity: 0.55;
            pointer-events: none;
        }

        .submix-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .status-line,
        .submix-status {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-family: monospace;
            color: var(--muted);
            line-height: 1.5;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .submix-list {
            display: grid;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
            flex: 0 0 auto;
            align-content: start;
            min-height: 0;
            max-height: none;
            overflow: visible;
        }

        .submix-actions {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: var(--space-sm);
        }

        .submix-actions .btn {
            min-width: 0;
            padding-left: 0.375rem;
            padding-right: 0.375rem;
        }

        .watermark-narrow-control {
            width: 100% !important;
            max-width: 100%;
        }

        .submix-empty {
            color: #94a3b8;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .submix-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0.5rem;
            align-items: center;
            border: 1px solid #e2e8f0;
            border-radius: 0.35rem;
            padding: 0.35rem;
            background: #fff;
        }

        .submix-item audio {
            grid-column: 1 / -1;
            width: 100%;
            height: 1.5rem;
        }

        .submix-label {
            min-width: 0;
            font-size: 0.875rem;
            font-family: monospace;
            color: #334155;
            overflow-wrap: anywhere;
        }

        .btn {
            border-radius: 0.35rem;
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
        }

        .btn:disabled,
        .form-control:disabled,
        .form-select:disabled {
            cursor: not-allowed;
            opacity: 0.62;
        }

        .panel-disabled {
            opacity: 0.58;
            background: #f8fafc;
        }

        .panel-disabled::after {
            content: none;
        }

        .btn-primary {
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.18);
        }

        .btn-primary:hover {
            background: #0b5ed7;
            box-shadow: 0 6px 14px rgba(13, 110, 253, 0.24);
            transform: translateY(-1px);
        }

        .btn-outline-primary,
        .btn-outline-secondary,
        .btn-outline-danger {
            border-width: 1px;
            background: #fff;
        }

        .btn-outline-primary {
            border-color: #b8cdf7;
            color: #355070;
        }

        .btn-outline-primary:hover {
            background: #f7fbff;
            color: #0d6efd;
            border-color: #6ea8fe;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.10);
            transform: translateY(-1px);
        }

        .btn-outline-secondary {
            border-color: #d5dbe3;
            color: #475569;
        }

        .btn-outline-secondary:hover {
            background: #f8fafc;
            color: #334155;
            border-color: #b8c2d1;
            box-shadow: 0 4px 10px rgba(71, 85, 105, 0.10);
            transform: translateY(-1px);
        }

        .btn-outline-danger {
            border-color: #f0b6bf;
            color: #b42335;
        }

        .btn-outline-danger:hover {
            background: #fff6f7;
            color: #dc3545;
            border-color: #ef8d98;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.10);
            transform: translateY(-1px);
        }

        video#mixed-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        #grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .grid-cell-label {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            font-weight: bold;
        }

        .audio-viz {
            height: 18px;
            flex-shrink: 0;
            background: #1e293b;
            position: relative;
            border-top: 1px solid #334155;
        }

        canvas#viz-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .source-strip {
            height: 128px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #f8fafc 0%, #eef3f9 100%);
            padding: 6px 8px 8px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: stretch;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #d7dee8;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        .source-strip-empty {
            grid-column: 1 / -1;
            color: #64748b;
            font-size: 12px;
            margin: auto;
        }

        .source-thumb {
            width: 100px;
            min-width: 0;
            height: 100%;
            background: #000;
            border: 1px solid #cbd5e1;
            border-radius: 0.35rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .source-thumb.selected {
            border-color: #0d6efd !important;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .source-thumb video {
            flex: 1;
            width: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .source-thumb .media-placeholder {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            color: #e2e8f0;
            background: #0f172a;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
        }

        .source-thumb .info {
            background: #334155;
            color: white;
            font-size: 9px;
            min-height: 18px;
            padding: 2px 5px;
            text-align: center;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .source-thumb .slot-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #0d6efd;
            color: white;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 2;
        }

        .source-thumb .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            border: none;
            z-index: 2;
        }

        .watermark-list {
            display: grid;
            gap: 6px;
            max-height: 90px;
            overflow-y: auto;
        }

        .hidden-state-sink {
            display: none !important;
        }

        .watermark-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px;
            padding: 7px;
            background: #fff;
            border: 1px solid #d7dee8;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.35;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.04);
        }

        .watermark-id {
            font-family: monospace;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .watermark-meta {
            grid-column: 1 / -1;
            color: var(--muted);
            font-family: monospace;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 22px;
            padding: 3px 7px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
        }

        .pill.ready {
            background: #dcfce7;
            color: #166534;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-xs);
            font-size: 12px;
            font-family: monospace;
            line-height: 1.3;
        }

        .stat-cell {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 4px 7px;
            background: #fff;
            border: 1px solid #d7dee8;
            border-radius: 0.35rem;
            min-width: 0;
            overflow-wrap: anywhere;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-cell span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        .stats-panel h2 {
            margin-bottom: 0.35rem !important;
        }

        .compact-card {
            background: #f8fafc;
            border: 1px solid #d7dee8;
            border-radius: 0.5rem;
            padding: var(--space-md);
        }

        .compact-card h2 {
            font-size: 0.85rem;
            margin-bottom: 0.45rem;
        }

        #panel-watermark .compact-card h2 {
            display: none;
        }

        .compact-card .form-label {
            font-size: 0.72rem;
        }

        .compact-card .mb-3 {
            margin-bottom: 0.45rem !important;
        }

        .compact-card .,
        .compact-card . {
            min-height: 31px;
            font-size: 0.82rem;
            padding-top: 0.2rem;
            padding-bottom: 0.2rem;
        }

        .compact-card .status-line,
        .compact-card .submix-status {
            margin-top: 0.45rem;
            font-size: 0.75rem;
        }

        .watermark-mode-tabs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--space-sm);
            padding: var(--space-xs);
            border: 1px solid #d7dee8;
            border-radius: 0.5rem;
            background: #f1f5f9;
        }

        .watermark-mode-btn {
            border: 1px solid #cbd5e1;
            border-radius: 0.4rem;
            background: #fff;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            transition: all 0.15s ease;
        }

        .watermark-mode-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .inspector-note {
            color: #64748b;
            font-size: 12px;
            line-height: 1.45;
        }

        @media (max-width: 1220px) {
            body {
                overflow: auto;
            }

            .app-shell {
                height: auto;
                min-height: 100vh;
            }

            .workspace-row {
                overflow: visible;
            }

            .panel-shell {
                min-height: 0;
            }
        }

        @media (max-width: 820px) {
            .app-shell {
                padding: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell container-fluid">
        <header class="app-header mb-2">
            <div class="d-flex flex-column gap-1">
                <h1 class="h5 mb-0">Mixer v6.3 工作台</h1>
                <div class="text-secondary small">CRTC.Mixer SDK 演示 · 输出、槽位、水印、子混音</div>
            </div>
        </header>

        <div class="row g-2 flex-grow-1 workspace-row min-h-0">
            <div class="col-12 mixer-col-left d-flex min-h-0">
                <div class="controls-stack d-flex flex-column flex-fill min-h-0">
                    <section id="panel-sources" class="panel-shell panel-disabled p-2">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h2 class="h6 mb-0">目标槽位</h2>
                            <span class="badge bg-light text-dark border">槽位</span>
                        </div>
                        <div class="selected-slot-card mb-2">
                            <div class="selected-slot-number" id="selected-slot-number">1</div>
                            <div class="selected-slot-meta">
                                <div class="fw-semibold text-dark">操作目标</div>
                                <div id="selected-slot-source">无源</div>
                                <div id="selected-slot-watermark">无槽位水印</div>
                            </div>
                        </div>
                        <div class="slot-grid-selector" id="slot-selector"></div>
                    </section>

                    <section id="panel-add-source" class="panel-shell panel-disabled p-2">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h2 class="h6 mb-0">添加输入源</h2>
                            <span class="badge bg-light text-dark border">输入</span>
                        </div>
                        <div class="row g-1 mb-2">
                            <div class="col-7">
                                <label class="form-label small mb-1" for="cfg-in-res">输入分辨率</label>
                                <select class="form-select" id="cfg-in-res">
                                    <option value="auto">自动</option>
                                    <optgroup label="横屏">
                                        <option value="1920x1080">1080p</option>
                                        <option value="1280x720">720p</option>
                                        <option value="654x480">480p</option>
                                        <option value="640x360">360p</option>
                                    </optgroup>
                                    <optgroup label="竖屏">
                                        <option value="1080x1920">1080p 竖屏</option>
                                        <option value="720x1280">720p 竖屏</option>
                                        <option value="480x654">480p 竖屏</option>
                                        <option value="360x640">360p 竖屏</option>
                                    </optgroup>
                                </select>
